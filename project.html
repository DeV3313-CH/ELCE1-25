<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Clone</title>
    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

       
        header {
            background-color: #2874f0;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        header .logo {
            font-size: 24px;
            font-weight: bold;
        }

        header .search-bar input {
            padding: 5px;
            width: 300px;
            border: none;
            border-radius: 2px;
        }

        header .search-bar button {
            padding: 6px 10px;
            border: none;
            background-color: #ffe500;
            cursor: pointer;
            margin-left: 5px;
        }

        header .cart {
            font-size: 18px;
        }
        .categories {
            display: flex;
            background-color: #f2f2f2;
            padding: 10px 20px;
        }

        .categories a {
            margin-right: 20px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
        .products {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            padding: 20px;
        }

        .product-card {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            margin: 10px;
            width: 200px;
            text-align: center;
            transition: transform 0.2s
        }

        .product-card:hover {
            transform: scale(1.05);
        }

        .product-card img {
            width: 150px;
            height: 150px;
        }

        
        footer {
            background-color: #2874f0;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Flipkart</div>
        <div class="search-bar">
            <input type="text" placeholder="Search for products, brands and more">
            <button>Search</button>
        </div>
        <div class="cart">
            <span>Cart</span>
        </div>
    </header>

    <nav class="categories">
        <a href="#">Electronics</a>
        <a href="#">Fashion</a>
        <a href="#">Home</a>
        <a href="#">Appliances</a>
        <a href="#">Toys & Kids</a>
    </nav>
    <section class="products">
        <div class="product-card">
            <img src="https://m.media-amazon.com/images/I/51f1YbJdQBL._SY450_.jpg" alt="Product 1">
            <h3>EARBUDS</h3>
            <p>₹999</p>
        </div>
        <div class="product-card">
            <img src="https://t4.ftcdn.net/jpg/05/81/81/35/360_F_581813566_e4ywdbkTYvxMbcDOL6ejx5WcYdySQeZj.jpg" alt="Product 2">
            <h3>HEADPHONES</h3>
            <p>₹1299</p>
        </div>
        <div class="product-card">
            <img src="https://zebronics.com/cdn/shop/files/Zeb-Buds11c-pic1.jpg?v=1739612805&width=2000" alt="Product 3">
            <h3>EARPHONES</h3>
            <p>₹499</p>
        </div>
        <div class="product-card">
            <img src="https://makpowerindia.com/cdn/shop/files/MakPower_Bass_Demon_Neckband_Earphones_black.webp?v=1737544121" alt="Product 4">
            <h3>NECK BAND</h3>
            <p>₹1999</p>
        </div>
    </section>
    <footer>
        <p>&copy; 2025 Flipkart Clone. All rights reserved.</p>
    </footer>
    <h4>@DEV CHAUHAN</h4>
    <H5>2025B02310034</H5>
</body>
</html>
